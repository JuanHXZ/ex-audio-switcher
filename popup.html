<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    /* Scrollbar oscuro integrado */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #11111b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #45475a;
      border-radius: 4px;
      border: 1.5px solid #11111b;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #585b70;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      font-weight: 600;
      color: #a6adc8;
    }
    #domain {
      display: inline-block;
      background: #313244;
      color: #89b4fa;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      word-break: break-all;
    }
    #media-info {
      font-size: 11px;
      color: #a6adc8;
      margin-top: 6px;
    }
    .device-list {
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid #313244;
      border-radius: 8px;
      background: #181825;
      padding: 8px;
      margin-bottom: 12px;
    }
    .device-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-bottom: 6px;
      background: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 12px;
    }
    .device-item:last-child {
      margin-bottom: 0;
    }
    .device-item:hover {
      background: #313244;
    }
    .device-item.active {
      border-color: #a6e3a1;
      background: #232838;
    }
    .radio-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #6c7086;
      flex-shrink: 0;
      position: relative;
    }
    .device-item.active .radio-dot {
      border-color: #a6e3a1;
    }
    .device-item.active .radio-dot::after {
      content: '';
      width: 6px;
      height: 6px;
      background: #a6e3a1;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .device-name {
      line-height: 1.3;
      word-break: break-word;
      color: #cdd6f4;
    }
    .device-item.active .device-name {
      color: #a6e3a1;
      font-weight: 600;
    }
    .unlock-box {
      text-align: center;
      padding: 12px 8px;
    }
    .unlock-box p {
      font-size: 11.5px;
      color: #a6adc8;
      margin: 0 0 10px 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: #89b4fa;
      color: #11111b;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover:not(:disabled) {
      opacity: 0.9;
    }
    #status {
      margin-top: 6px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Salida de audio para</h3>
    <div id="domain">Cargando...</div>
    <div id="media-info">Buscando reproductores...</div>
  </div>

  <div class="device-list" id="device-container"></div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
